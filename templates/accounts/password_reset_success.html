{% extends "base.html" %}
{% block title %}Password reset complete | Fieldwork{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Password reset complete</h1>
  </div>
  <div class="auth-panel">
    <h2>Your password has been reset successfully.</h2>
    <p class="muted">Sign in with your new password.</p>
    <a class="button button-primary" href="{% url 'accounts:login' %}">Back to sign in</a>
  </div>
</section>
{% endblock %}
