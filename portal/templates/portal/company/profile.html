{% extends "base.html" %}
{% block title %}Company profile | Fieldwork{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">HOST ORGANIZATION</p>
    <h1>Company profile</h1>
    <p class="muted">Keep your organization details up to date.</p>
  </div>
</div>

<section class="panel form-panel">
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <a class="button button-secondary" href="{% url 'portal:company_dashboard' %}">Cancel</a>
      <button class="button button-primary" type="submit">Save profile</button>
    </div>
  </form>
</section>
{% endblock %}
