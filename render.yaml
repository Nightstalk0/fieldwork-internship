services:
  - type: web
    name: django-ims
    runtime: python
    buildCommand: bash build.sh
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: django_ims.settings
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: fieldwork-internship.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: FACE_EMBEDDING_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false